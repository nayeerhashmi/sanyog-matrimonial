<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#70253f"><title>My photo gallery | Sanyog</title>
<style>
:root{--wine:#70253f;--cream:#fbf8f2;--paper:#fffdf9;--ink:#292324;--muted:#766a6b;--line:#e9dfd9;--rose:#f3e8e9}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.top{height:70px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1000px)/2))}.brand{font:600 1.4rem Georgia;color:var(--wine)}.top a{font-size:.85rem;color:var(--wine)}main{max-width:1000px;margin:55px auto;padding:0 22px}.eyebrow{font-size:.68rem;letter-spacing:.15em;color:var(--wine);font-weight:750;text-transform:uppercase}h1{font:500 clamp(2.2rem,5vw,3.2rem) Georgia;margin:9px 0}.intro{color:var(--muted);line-height:1.6;max-width:680px}.notice{display:none;padding:13px 15px;border-radius:9px;background:#f3e8e9;color:var(--wine);margin:20px 0;font-size:.88rem}.notice.show{display:block}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.slot{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}.preview{height:310px;background:#f2ece7;display:grid;place-items:center;color:#8c7c7b;position:relative}.preview img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;padding:20px}.placeholder b{display:block;font:1.1rem Georgia;margin-bottom:8px;color:var(--ink)}.slot-body{padding:17px}.slot-body h2{font:600 1.15rem Georgia;margin:0 0 6px}.slot-body p{font-size:.78rem;color:var(--muted);line-height:1.5;min-height:36px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d8c4c7;background:white;color:var(--wine);padding:10px 13px;border-radius:8px;font-weight:700;font-size:.78rem;cursor:pointer}.btn.primary{background:var(--wine);color:white}.btn:disabled{opacity:.55;cursor:wait}input[type=file]{display:none}.foot{margin:45px 0;text-align:center;color:var(--muted);font-size:.76rem}@media(max-width:760px){.gallery{grid-template-columns:1fr}.preview{height:360px}main{margin:35px auto}.top{height:62px}}
</style></head><body>
<header class="top"><a class="brand" href="index.html">sanyog</a><a href="dashboard.html#photos">← Back to dashboard</a></header>
<main><div class="eyebrow">Your private gallery</div><h1>Profile photos</h1><p class="intro">View and manage your three profile pictures here. This gallery is private to your signed-in account. Adding or changing a photo will not reopen profile setup.</p><div class="notice" id="notice" role="status"></div><section class="gallery" id="gallery"><p>Loading your gallery…</p></section><p class="foot">Sanyog · Your photos stay in private storage.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient("https://eoziavhnktcsqmtnfuhz.supabase.co","sb_publishable_j1jUq-wkJmt6v_VrHvyimQ_hHu0vSMa");const slots=[{key:"photo_close_up_path",name:"Close-up",hint:"A clear face photo"},{key:"photo_half_length_path",name:"Half-length",hint:"A relaxed half-length photo"},{key:"photo_full_length_path",name:"Full-length",hint:"A full-length photo"}];let user,profile={};const $=id=>document.getElementById(id);function say(t){$("notice").textContent=t;$("notice").classList.add("show")}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function render(){const root=$("gallery");root.innerHTML="";for(let n=0;n<slots.length;n++){const s=slots[n],path=profile[s.key];let url="";if(path){const signed=await db.storage.from("member-photos").createSignedUrl(path,3600);if(!signed.error)url=signed.data.signedUrl;}const card=document.createElement("article");card.className="slot";card.innerHTML='<div class="preview">'+(url?'<img alt="'+esc(s.name)+' profile photo" src="'+url+'">':'<div class="placeholder"><b>'+esc(s.name)+'</b><span>No photo added yet</span></div>')+'</div><div class="slot-body"><h2>'+esc(s.name)+'</h2><p>'+esc(s.hint)+' · JPG, PNG or WebP, maximum 5 MB</p><div class="actions"><button class="btn primary" data-upload="'+n+'">'+(path?"Change photo":"Add photo")+'</button>'+(path?'<button class="btn" data-remove="'+n+'">Remove</button>':'')+'</div><input type="file" accept="image/jpeg,image/png,image/webp" id="file'+n+'"></div>';root.appendChild(card);card.querySelector('[data-upload]').addEventListener("click",()=>card.querySelector("input").click());card.querySelector("input").addEventListener("change",e=>upload(n,e.target.files[0],card));const remove=card.querySelector("[data-remove]");if(remove)remove.addEventListener("click",()=>removePhoto(n,remove));}}
async function upload(n,file,card){if(!file)return;if(!["image/jpeg","image/png","image/webp"].includes(file.type)){say("Please choose a JPG, PNG or WebP image.");return}if(file.size>5*1024*1024){say("Each photo must be 5 MB or smaller.");return}const s=slots[n],btn=card.querySelector(".primary"),old=profile[s.key];btn.disabled=true;btn.textContent="Uploading…";const ext=file.type==="image/jpeg"?"jpg":file.type==="image/png"?"png":"webp";const path=user.id+"/"+s.key.replace("_path","")+"."+ext;const up=await db.storage.from("member-photos").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});if(up.error){say("Upload failed. "+up.error.message);btn.disabled=false;btn.textContent=old?"Change photo":"Add photo";return}const update=await db.from("profiles").update({[s.key]:path}).eq("user_id",user.id);if(update.error){say("Photo uploaded but the profile record could not be updated. "+update.error.message);btn.disabled=false;return}profile[s.key]=path;if(old&&old!==path)await db.storage.from("member-photos").remove([old]);say(s.name+" photo updated.");await render()}
async function removePhoto(n,btn){const s=slots[n],path=profile[s.key];if(!path)return;if(!confirm("Remove your "+s.name.toLowerCase()+" photo?"))return;btn.disabled=true;const upd=await db.from("profiles").update({[s.key]:null}).eq("user_id",user.id);if(upd.error){say("Could not update your profile. "+upd.error.message);btn.disabled=false;return}const del=await db.storage.from("member-photos").remove([path]);profile[s.key]=null;if(del.error)say("Photo removed from your profile, but storage cleanup needs attention.");else say(s.name+" photo removed.");await render()}
async function init(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace("auth.html");return}user=data.session.user;const res=await db.from("profiles").select("photo_close_up_path,photo_half_length_path,photo_full_length_path").eq("user_id",user.id).maybeSingle();if(res.error){say("Could not load your gallery. "+res.error.message);$("gallery").innerHTML="";return}profile=res.data||{};await render()}init();
})();
</script></body></html>
